{% extends 'base.html' %}

{% block title %}Sesión Cerrada - Inmuebles Chile{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
      <div class="card shadow-sm border-0 rounded-3 text-center">
        <div class="card-body p-4 p-sm-5">
          
          <div class="mb-3">
            <i class="bi bi-check-circle-fill text-success display-3"></i>
          </div>

          <h2 class="fw-bold mb-2">Sesión Cerrada</h2>
          <p class="text-muted">Has cerrado sesión exitosamente en la plataforma. ¡Esperamos verte pronto!</p>

          <hr class="my-4">

          <div class="d-grid gap-2">
            <a href="{% url 'gestion_inmuebles:login' %}" class="btn btn-warning fw-bold text-dark">
              <i class="bi bi-box-arrow-in-right me-1"></i> Volver a Iniciar Sesión
            </a>
            <a href="{% url 'gestion_inmuebles:index' %}" class="btn btn-outline-secondary">
              <i class="bi bi-house-door me-1"></i> Ir al Inicio
            </a>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
